name: Reashal Studio validation

on:
  workflow_dispatch:
    inputs:
      idempotency_key:
        description: Stable publication retry key
        required: true
        type: string
      candidate_sha:
        description: Candidate commit that must be validated
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: reashal-studio-${{ inputs.idempotency_key }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify dispatched commit
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type and content checks
        run: npm run check

      - name: Production build
        run: npm run build
